name: PR preview build

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    permissions:
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/build-dokploy-preview.yml@v1
    with:
      package: app
      local-image: app
      domain: ras.sh
      subdomain-prefix: app-pr
      marker: <!-- app-preview -->
      note: Preview data is disposable and resets on every deployment. Never enter real data or credentials.
      platform: linux/arm64
      cache-scope: preview
      build-args: |
        VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
        VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}
