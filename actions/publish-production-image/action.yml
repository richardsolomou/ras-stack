name: Publish production image
description: Build and publish release, latest, and commit tags, then return a digest-pinned reference.

inputs:
  image:
    description: Registry image name without a tag.
    required: true
  sha:
    description: Released commit SHA.
    required: true
  release-tag:
    description: Released version tag.
    required: true
  token:
    description: Registry token with package write permission.
    required: true
  registry:
    description: Container registry hostname.
    default: ghcr.io
  context:
    description: Docker build context.
    default: .
  dockerfile:
    description: Dockerfile path.
    default: Dockerfile
  platforms:
    description: Buildx platform list.
    default: linux/amd64
  build-args:
    description: Newline-separated Docker build arguments.
    default: ''
  cache-scope:
    description: GitHub Actions cache scope.
    default: production-image

outputs:
  reference:
    description: Commit tag pinned to the published manifest digest.
    value: ${{ steps.reference.outputs.reference }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - name: Build and publish production image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: |
          ${{ inputs.image }}:latest
          ${{ inputs.image }}:${{ inputs.release-tag }}
          ${{ inputs.image }}:sha-${{ inputs.sha }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
    - name: Record immutable image reference
      id: reference
      shell: bash
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        IMAGE: ${{ inputs.image }}
        SHA: ${{ inputs.sha }}
      run: |
        [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "reference=${IMAGE}:sha-${SHA}@${DIGEST}" >> "$GITHUB_OUTPUT"
        echo "Published \`${IMAGE}:sha-${SHA}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
