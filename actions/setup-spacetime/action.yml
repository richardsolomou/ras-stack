name: Set up SpacetimeDB
description: Install checksum-pinned official SpacetimeDB binaries on Linux.

inputs:
  version:
    description: Exact release version without the leading v.
    required: true
  sha256:
    description: SHA-256 of the Linux archive for this runner architecture.
    required: true

outputs:
  cli-path:
    description: Absolute path to spacetimedb-cli, also available as spacetime on PATH.
    value: ${{ steps.install.outputs.cli-path }}
  standalone-path:
    description: Absolute path to spacetimedb-standalone.
    value: ${{ steps.install.outputs.standalone-path }}

runs:
  using: composite
  steps:
    - name: Restore release archive
      id: restore
      uses: actions/cache/restore@v6
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ${{ runner.temp }}/spacetimedb-release.tar.gz
        key: spacetimedb-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}-${{ inputs.sha256 }}
    - name: Install pinned binaries
      id: install
      shell: bash
      env:
        SPACETIME_VERSION: ${{ inputs.version }}
        SPACETIME_SHA256: ${{ inputs.sha256 }}
        SPACETIME_ARCHIVE: ${{ runner.temp }}/spacetimedb-release.tar.gz
      run: bash "$GITHUB_ACTION_PATH/install.sh"
    # Saved here rather than after the job, so a failing test run still leaves the archive for the next one.
    - name: Save release archive
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/spacetimedb-release.tar.gz
        key: ${{ steps.restore.outputs.cache-primary-key }}
