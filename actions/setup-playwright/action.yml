name: Set up Playwright browser
description: Install browser system dependencies and cache the pinned Playwright browser payload.

inputs:
  browser:
    description: Playwright browser to install.
    default: chromium
  install-dependencies:
    description: Install browser system dependencies with the host package manager.
    default: 'true'
  working-directory:
    description: Directory containing the Playwright dependency.
    default: .

runs:
  using: composite
  steps:
    - name: Read Playwright version
      id: version
      shell: bash
      env:
        PLAYWRIGHT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        version="$(pnpm --dir "$PLAYWRIGHT_WORKING_DIRECTORY" exec playwright --version)"
        echo "version=${version#Version }" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browser
      id: cache
      uses: actions/cache@v6
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browser }}-${{ steps.version.outputs.version }}
    - name: Install browser system dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
        PLAYWRIGHT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: pnpm --dir "$PLAYWRIGHT_WORKING_DIRECTORY" exec playwright install-deps "$PLAYWRIGHT_BROWSER"
    - name: Install browser payload
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PLAYWRIGHT_BROWSER: ${{ inputs.browser }}
        PLAYWRIGHT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: pnpm --dir "$PLAYWRIGHT_WORKING_DIRECTORY" exec playwright install "$PLAYWRIGHT_BROWSER"
