name: Commit managed RAS dependencies
description: Commit only a regenerated RAS hook and pnpm lockfile to an unchanged Dependabot branch.
inputs:
  head-sha:
    description: Full pull request head SHA used for regeneration.
    required: true
  directory:
    description: Directory containing the regenerated hook and lockfile.
    required: true
  token:
    description: Token with contents write and pull requests read permission.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      env:
        RAS_ACTION_PATH: ${{ github.action_path }}
        RAS_HEAD_SHA: ${{ inputs.head-sha }}
        RAS_DIRECTORY: ${{ inputs.directory }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { pathToFileURL } = await import('node:url');
          const { managedCommit } = await import(pathToFileURL(`${process.env.RAS_ACTION_PATH}/commit.ts`).href);
          const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
          const repository = `${context.repo.owner}/${context.repo.repo}`;
          const input = await managedCommit(repository, pr, process.env.RAS_HEAD_SHA, process.env.RAS_DIRECTORY);
          const result = await github.graphql(`mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { url } }
          }`, { input });
          core.notice(`Updated managed dependencies: ${result.createCommitOnBranch.commit.url}`);
          await core.summary.addRaw('Regenerated the RAS hook and pnpm lockfile in this PR. If GitHub requests approval for the resulting CI runs, select **Approve workflows to run** on the PR. An optional bot token avoids this GitHub token restriction.').write();
