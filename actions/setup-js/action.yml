name: Set up JavaScript toolchain
description: Install the repository's declared Node and pnpm versions, restore the pnpm cache, and optionally install dependencies and just.

inputs:
  install:
    description: Run pnpm install with the frozen lockfile.
    default: 'true'
  just-version:
    description: Install this version of just when provided.
    default: ''

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: pnpm
    - name: Install just
      if: inputs.just-version != ''
      uses: extractions/setup-just@v4
      with:
        just-version: ${{ inputs.just-version }}
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
