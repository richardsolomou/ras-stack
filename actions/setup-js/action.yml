name: Set up JavaScript toolchain
description: Install the repository's declared Node and pnpm versions, restore the pnpm cache, and optionally install dependencies.

inputs:
  install:
    description: Run pnpm install with the frozen lockfile.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    - name: Install Node
      uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: pnpm
    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
