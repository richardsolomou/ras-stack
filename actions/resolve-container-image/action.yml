name: Resolve container image
description: Resolve a readable container tag to a digest-pinned reference.

inputs:
  image:
    description: Container image tag to resolve.
    required: true
  registry-username:
    description: Registry username for a private image.
    default: ''
  registry-password:
    description: Registry password or token for a private image.
    default: ''
  registry:
    description: Container registry hostname.
    default: ghcr.io

outputs:
  reference:
    description: Image reference containing both the readable tag and immutable digest.
    value: ${{ steps.resolve.outputs.reference }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
    - name: Log in to private registry
      if: inputs.registry-username != '' || inputs.registry-password != ''
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USERNAME: ${{ inputs.registry-username }}
        REGISTRY_PASSWORD: ${{ inputs.registry-password }}
      run: |
        test -n "$REGISTRY_USERNAME" && test -n "$REGISTRY_PASSWORD"
        echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
    - name: Resolve immutable reference
      id: resolve
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"
