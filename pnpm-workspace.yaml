packages:
  - .
  - apps/*
  - packages/*
  - recipes
allowBuilds:
  '@posthog/cli': true
  better-sqlite3: true
  core-js: false
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAge: 10080
# Better Auth 1.7 is the compatibility target the auth recipe and its stacks exercise.
minimumReleaseAgeExclude:
  - ras-stack
  - better-auth
  - '@better-auth/*'
  # PostHog is a trusted publisher whose SDK fixes RAS should pick up the day they ship.
  - 'posthog-*'
  - '@posthog/*'
