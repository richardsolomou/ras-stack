name: Deploy Dokploy preview

on:
  workflow_call:
    inputs:
      package:
        description: GHCR package name.
        type: string
        required: true
      local-image:
        description: Local image name stored in fork artifacts.
        type: string
        required: true
      application-prefix:
        description: Dokploy application name prefix.
        type: string
        required: true
      domain:
        description: Custom preview domain. Omit to use a Dokploy generated sslip.io domain.
        type: string
        default: ''
      subdomain-prefix:
        description: Prefix placed before the pull request number for custom domains.
        type: string
        default: pr
      cloudflare-zone-id:
        description: Cloudflare zone whose proxied preview records are managed by ras-stack.
        type: string
        default: ''
      port:
        description: Application HTTP port.
        type: number
        required: true
      environment:
        description: Multiline environment template. Supports {{PR_NUMBER}}, {{PREVIEW_URL}}, and {{RANDOM_HEX_32}}.
        type: string
        default: ''
      health-path:
        description: HTTP health-check path.
        type: string
        default: /api/health
      marker:
        description: Stable marker for the pull-request status comment.
        type: string
        required: true
      note:
        description: Safety and usage note shown in the pull-request comment.
        type: string
        default: Preview data is disposable and resets on every deployment.
      deploy-script:
        description: Trusted repository script used for app-specific lifecycle hooks.
        type: string
        default: ''
      playwright-config:
        description: Playwright config used to verify the deployed preview.
        type: string
        default: ''
      dependabot-environment:
        description: Protected GitHub environment required before deploying Dependabot previews.
        type: string
        default: dependabot-preview
    secrets:
      DOKPLOY_URL:
        required: true
      DOKPLOY_API_KEY:
        required: true
      DOKPLOY_ENVIRONMENT_ID:
        required: true
      PREVIEW_REGISTRY_USERNAME:
        required: false
      PREVIEW_REGISTRY_PASSWORD:
        required: false
      PREVIEW_APP_SECRETS:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false

env:
  CUSTOM_PREVIEW_URL: ${{ inputs.domain != '' && format('https://{0}-{1}.{2}', inputs.subdomain-prefix, github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number, inputs.domain) || '' }}

jobs:
  classify-pr:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0]) || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dependabot: ${{ steps.pr.outputs.dependabot }}
    steps:
      - name: Classify pull request
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
        run: |
          dependabot=false
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            author="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .user.login)"
            if [[ "$author" == "dependabot[bot]" ]]; then
              dependabot=true
            fi
          fi
          echo "dependabot=$dependabot" >> "$GITHUB_OUTPUT"

  mark-fork-status:
    if: github.event_name == 'workflow_run' && (github.event.action == 'requested' || github.event.action == 'in_progress') && github.event.workflow_run.pull_requests[0] && github.event.workflow_run.pull_requests[0].head.repo.id != github.event.repository.id
    concurrency:
      group: dokploy-status-${{ github.repository }}-${{ inputs.application-prefix }}-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.46.0
      - name: Report fork preview status
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PREVIEW_MARKER: ${{ inputs.marker }}
          PREVIEW_NOTE: ${{ inputs.note }}
          PREVIEW_URL: ${{ inputs.domain != '' && format('https://{0}-{1}.{2}', inputs.subdomain-prefix, github.event.workflow_run.pull_requests[0].number, inputs.domain) || '' }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATE: ${{ github.event.action == 'requested' && 'awaiting' || 'building' }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          read -r pr_state head_sha < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .head.sha] | @tsv')
          run_status="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WORKFLOW_RUN_ID" --jq .status)"
          if [[ "$pr_state" == "open" && "$head_sha" == "$COMMIT_SHA" && "$run_status" != "completed" ]]; then
            pnpm exec ras preview "$STATE"
          fi
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)" == "closed" ]]; then
            pnpm exec ras preview deleted
          fi

  deploy:
    needs: classify-pr
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0]) || github.event_name == 'pull_request_target'
    environment: ${{ needs.classify-pr.outputs.dependabot == 'true' && inputs.dependabot-environment || null }}
    concurrency:
      group: dokploy-${{ github.repository }}-${{ inputs.application-prefix }}-pr-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.46.0
      - name: Verify Dependabot deployment protection
        if: needs.classify-pr.outputs.dependabot == 'true'
        env:
          DEPENDABOT_ENVIRONMENT: ${{ inputs.dependabot-environment }}
          GH_TOKEN: ${{ github.token }}
        run: |
          protected="$(gh api "repos/$GITHUB_REPOSITORY/environments/$DEPENDABOT_ENVIRONMENT" --jq 'any(.protection_rules[]; .type == "required_reviewers")')"
          if [[ "$protected" != "true" ]]; then
            echo "The $DEPENDABOT_ENVIRONMENT environment must have required reviewers configured." >&2
            exit 1
          fi
      - name: Resolve pull request state
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          read -r state head_sha < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .head.sha] | @tsv')
          if [[ "$state" != "open" && "$state" != "closed" ]]; then
            echo "Unexpected pull request state: $state" >&2
            exit 1
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [[ "$state" == "closed" ]]; then
            echo "action=delete" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_run" && "$head_sha" == "$WORKFLOW_SHA" ]]; then
            echo "action=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "action=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Delete closed preview
        if: steps.pr.outputs.action == 'delete'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_ENVIRONMENT_ID: ${{ secrets.DOKPLOY_ENVIRONMENT_ID }}
          PREVIEW_APP_SECRETS: ${{ secrets.PREVIEW_APP_SECRETS }}
          PREVIEW_APPLICATION_PREFIX: ${{ inputs.application-prefix }}
          PREVIEW_DOMAIN: ${{ inputs.domain }}
          PREVIEW_SUBDOMAIN_PREFIX: ${{ inputs.subdomain-prefix }}
          PREVIEW_PORT: ${{ inputs.port }}
          PREVIEW_HEALTH_PATH: ${{ inputs.health-path }}
          PREVIEW_SCRIPT: ${{ inputs.deploy-script }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ inputs.cloudflare-zone-id }}
        run: |
          if [[ -n "$PREVIEW_SCRIPT" ]]; then
            pnpm exec tsx "$PREVIEW_SCRIPT" delete
          else
            pnpm exec ras preview dokploy delete
          fi
      - name: Mark closed preview as deleted
        if: steps.pr.outputs.action == 'delete'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          PREVIEW_MARKER: ${{ inputs.marker }}
        run: pnpm exec ras preview deleted
      - name: Delete closed preview images
        if: steps.pr.outputs.action == 'delete'
        uses: richardsolomou/ras-stack/actions/prune-preview-images@v0.46.0
        with:
          token: ${{ github.token }}
          package: ${{ inputs.package }}
          pr-number: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
      - name: Publish fork preview image
        if: steps.pr.outputs.action == 'deploy' && github.event.workflow_run.pull_requests[0].head.repo.id != github.event.repository.id
        uses: richardsolomou/ras-stack/actions/publish-preview-image@v0.46.0
        with:
          artifact-name: preview-image-${{ github.event.workflow_run.pull_requests[0].number }}
          run-id: ${{ github.event.workflow_run.id }}
          source-image: ${{ inputs.local-image }}:preview-pr-${{ github.event.workflow_run.pull_requests[0].number }}-sha-${{ github.event.workflow_run.head_sha }}
          target-image: ghcr.io/${{ github.repository_owner }}/${{ inputs.package }}:preview-pr-${{ github.event.workflow_run.pull_requests[0].number }}-sha-${{ github.event.workflow_run.head_sha }}
          token: ${{ github.token }}
      - name: Resolve immutable preview image
        id: image
        if: steps.pr.outputs.action == 'deploy'
        uses: richardsolomou/ras-stack/actions/resolve-container-image@v0.46.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ inputs.package }}:preview-pr-${{ github.event.workflow_run.pull_requests[0].number }}-sha-${{ github.event.workflow_run.head_sha }}
          registry-username: ${{ secrets.PREVIEW_REGISTRY_USERNAME }}
          registry-password: ${{ secrets.PREVIEW_REGISTRY_PASSWORD }}
      - name: Deploy preview
        id: deploy
        if: steps.pr.outputs.action == 'deploy'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_ENVIRONMENT_ID: ${{ secrets.DOKPLOY_ENVIRONMENT_ID }}
          PREVIEW_REGISTRY_USERNAME: ${{ secrets.PREVIEW_REGISTRY_USERNAME }}
          PREVIEW_REGISTRY_PASSWORD: ${{ secrets.PREVIEW_REGISTRY_PASSWORD }}
          PREVIEW_APP_SECRETS: ${{ secrets.PREVIEW_APP_SECRETS }}
          PREVIEW_IMAGE: ${{ steps.image.outputs.reference }}
          PREVIEW_APPLICATION_PREFIX: ${{ inputs.application-prefix }}
          PREVIEW_DOMAIN: ${{ inputs.domain }}
          PREVIEW_SUBDOMAIN_PREFIX: ${{ inputs.subdomain-prefix }}
          PREVIEW_PORT: ${{ inputs.port }}
          PREVIEW_HEALTH_PATH: ${{ inputs.health-path }}
          PREVIEW_ENVIRONMENT: ${{ inputs.environment }}
          PREVIEW_SCRIPT: ${{ inputs.deploy-script }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ inputs.cloudflare-zone-id }}
        run: |
          if [[ -n "$PREVIEW_SCRIPT" ]]; then
            pnpm exec tsx "$PREVIEW_SCRIPT" deploy
          else
            PREVIEW_ENVIRONMENT="${PREVIEW_ENVIRONMENT//'{{PR_NUMBER}}'/$PR_NUMBER}"
            while [[ "$PREVIEW_ENVIRONMENT" == *'{{RANDOM_HEX_32}}'* ]]; do
              PREVIEW_ENVIRONMENT="${PREVIEW_ENVIRONMENT/'{{RANDOM_HEX_32}}'/$(openssl rand -hex 32)}"
            done
            export PREVIEW_ENVIRONMENT
            pnpm exec ras preview dokploy deploy
          fi
      - name: Install preview browser
        if: steps.pr.outputs.action == 'deploy' && inputs.playwright-config != ''
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify preview
        if: steps.pr.outputs.action == 'deploy' && inputs.playwright-config != ''
        env:
          PREVIEW_BASE_URL: ${{ steps.deploy.outputs.preview-url || env.CUSTOM_PREVIEW_URL }}
          PLAYWRIGHT_CONFIG: ${{ inputs.playwright-config }}
        run: pnpm exec playwright test --config "$PLAYWRIGHT_CONFIG"
      - name: Mark preview as ready
        if: steps.pr.outputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_MARKER: ${{ inputs.marker }}
          PREVIEW_NOTE: ${{ inputs.note }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url || env.CUSTOM_PREVIEW_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm exec ras preview ready
      - name: Mark preview as failed
        if: failure() && steps.pr.outputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_MARKER: ${{ inputs.marker }}
          PREVIEW_NOTE: ${{ inputs.note }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url || env.CUSTOM_PREVIEW_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm exec ras preview failed
