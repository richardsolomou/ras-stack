name: Fleet health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-js
      - run: pnpm build
      - name: Inspect fleet adoption
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node dist/cli.js policy fleet | tee fleet-health.md
          status=${PIPESTATUS[0]}
          set -e
          cat fleet-health.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fleet-health
          path: fleet-health.md
          if-no-files-found: error
          retention-days: 30
