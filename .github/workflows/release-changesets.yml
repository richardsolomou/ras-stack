name: Release Changesets

on:
  workflow_call:
    outputs:
      created:
        description: Whether this run created a release.
        value: ${{ jobs.release.outputs.created }}
      tag:
        description: Created release tag, or an empty string when no release was needed.
        value: ${{ jobs.release.outputs.tag }}
      sha:
        description: Released commit, or the triggering commit when no release was needed.
        value: ${{ jobs.release.outputs.sha }}
    inputs:
      version-command:
        description: Command that consumes pending changesets and updates versions and changelogs.
        type: string
        default: pnpm version-packages
      tag-prefix:
        description: Prefix added to the root package version for the Git tag.
        type: string
        default: v
    secrets:
      CHANGESETS_TOKEN:
        description: Optional token used to push through protected branches.
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN || github.token }}
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.46.0
      - name: Release pending changesets
        id: release
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN || github.token }}
          TAG_PREFIX: ${{ inputs.tag-prefix }}
          VERSION_COMMAND: ${{ inputs.version-command }}
        run: |
          set -euo pipefail
          stand_down() {
            {
              echo "created=false"
              echo "tag="
              echo "sha=$GITHUB_SHA"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          count=0
          shopt -s nullglob
          for file in .changeset/*.md; do
            if grep -qE ': (patch|minor|major)$' "$file"; then
              count=$((count + 1))
            fi
          done
          if [ "$count" = "0" ]; then
            stand_down
          fi
          git fetch origin "$GITHUB_REF_NAME" --tags
          if [ "$(git rev-parse "origin/$GITHUB_REF_NAME")" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_REF_NAME advanced past $GITHUB_SHA, so the run for its current head releases these changesets"
            stand_down
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash -euo pipefail -c "$VERSION_COMMAND"
          tag="${TAG_PREFIX}$(node -p "require('./packages/ras-stack/package.json').version")"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 1
          fi
          git add -A
          git commit -m "chore: release ${tag} [skip ci]"
          release_sha="$(git rev-parse HEAD)"
          git tag "$tag"
          git push --atomic origin "HEAD:$GITHUB_REF_NAME" "$tag"
          gh release create "$tag" --title "$tag" --generate-notes
          {
            echo "created=true"
            echo "tag=$tag"
            echo "sha=$release_sha"
          } >> "$GITHUB_OUTPUT"
