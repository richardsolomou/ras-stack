name: Check production container in browser

on:
  workflow_call:
    inputs:
      command:
        description: Repository-owned browser test command targeting the loaded image.
        type: string
        required: true
      image:
        description: Local image tag exposed to the test command.
        type: string
        required: true
      prepare-command:
        description: Optional repository-specific preparation before the image build.
        type: string
        default: ''
      build-context:
        description: Docker build context.
        type: string
        default: .
      dockerfile:
        description: Dockerfile path.
        type: string
        default: Dockerfile
      build-args:
        description: Newline-separated Docker build arguments.
        type: string
        default: ''
      cache-scope:
        description: GitHub Actions cache scope for the application image.
        type: string
        default: e2e-image
      browser:
        description: Playwright browser to install.
        type: string
        default: chromium
      just-version:
        description: Install this Just version, or leave empty when commands do not use Just.
        type: string
        default: ''
      artifact-name:
        description: Failure artifact name.
        type: string
        default: playwright-results
      artifact-path:
        description: Failure artifact path.
        type: string
        default: test-results
      artifact-retention-days:
        description: Failure artifact retention period.
        type: number
        default: 7
      runner:
        description: GitHub-hosted or self-hosted runner label.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Maximum job runtime.
        type: number
        default: 30

jobs:
  container-browser:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.39.3
      - if: inputs.just-version != ''
        uses: richardsolomou/ras-stack/actions/setup-just@v0.39.3
        with:
          version: ${{ inputs.just-version }}
      - name: Prepare application
        if: inputs.prepare-command != ''
        env:
          PREPARE_COMMAND: ${{ inputs.prepare-command }}
        run: bash -euo pipefail -c "$PREPARE_COMMAND"
      - name: Set up browser
        uses: richardsolomou/ras-stack/actions/setup-playwright@v0.38.2
        with:
          browser: ${{ inputs.browser }}
      - name: Build production image
        id: image
        uses: richardsolomou/ras-stack/actions/build-container@v0.38.2
        with:
          image: ${{ inputs.image }}
          context: ${{ inputs.build-context }}
          dockerfile: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          cache-scope: ${{ inputs.cache-scope }}
      - name: Run browser checks
        env:
          BROWSER_CHECK_COMMAND: ${{ inputs.command }}
          RAS_STACK_TEST_IMAGE: ${{ inputs.image }}
        run: |
          started=$(date +%s)
          set +e
          bash -euo pipefail -c "$BROWSER_CHECK_COMMAND"
          status=$?
          set -e
          seconds=$(($(date +%s) - started))
          {
            echo "Container build: ${{ steps.image.outputs.duration-seconds }}s"
            echo "Browser checks: ${seconds}s"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}
