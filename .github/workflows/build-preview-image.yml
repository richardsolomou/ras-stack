name: Build secure preview image

on:
  workflow_call:
    inputs:
      published-image:
        description: Registry image tag for a same-repository pull request.
        type: string
        required: true
      fork-image:
        description: Local image tag placed in a fork artifact.
        type: string
        required: true
      artifact-name:
        description: Artifact name used for a fork image.
        type: string
        required: true
      context:
        description: Docker build context.
        type: string
        default: .
      dockerfile:
        description: Dockerfile path.
        type: string
        default: Dockerfile
      build-args:
        description: Newline-separated Docker build arguments.
        type: string
        default: ''
      cache-scope:
        description: GitHub Actions cache scope.
        type: string
        default: preview-image

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the container registry
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish trusted preview image
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          tags: ${{ inputs.published-image }}
          build-args: ${{ inputs.build-args }}
          push: true
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
          cache-to: type=gha,mode=min,scope=${{ inputs.cache-scope }}
      - name: Build untrusted preview artifact
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          tags: ${{ inputs.fork-image }}
          build-args: ${{ inputs.build-args }}
          outputs: type=docker,dest=${{ runner.temp }}/preview-image.tar
          cache-from: type=gha,scope=${{ inputs.cache-scope }}
      - name: Store untrusted preview artifact
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/preview-image.tar
          retention-days: 1
          compression-level: 0
