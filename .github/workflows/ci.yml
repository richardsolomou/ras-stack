name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check-js.yml
    with:
      command: just --version && just check
      just-version: '1.58.0'

  actions:
    name: Actions and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./actions/setup-just
        with:
          version: '1.58.0'
      - run: just check-actions

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ras_stack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-js
      - name: Exercise the published PostgreSQL statements
        env:
          RAS_STACK_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/ras_stack_test
        run: pnpm exec vitest run src/database/postgres-integration.test.ts --coverage.enabled=false

  example:
    name: Full-stack example
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-js
      - uses: ./actions/setup-playwright
      - uses: docker/setup-buildx-action@v4
      - name: Build package and example
        run: pnpm build && pnpm --filter @ras-stack/example-full-stack check
      - name: Build and inspect runtime binaries
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runtime/Dockerfile
          tags: ras-stack-runtime-binaries:test
          load: true
          cache-from: type=gha,scope=runtime-binaries
          cache-to: type=gha,mode=max,scope=runtime-binaries
      - name: Inspect runtime binaries
        run: |
          test "$(docker image inspect ras-stack-runtime-binaries:test --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$(cat runtime/VERSION)"
          test "$(docker run --rm --entrypoint /usr/local/bin/caddy ras-stack-runtime-binaries:test version)" = 'v2.11.4'
          docker run --rm --entrypoint /usr/local/bin/centrifugo ras-stack-runtime-binaries:test version | grep -F 'Centrifugo v6.9.1 '
      - name: Build production image
        run: docker build --build-arg RUNTIME_BINARIES_IMAGE=ras-stack-runtime-binaries:test -f examples/full-stack/Dockerfile -t ras-stack-example:e2e .
      - name: Start production image
        run: |
          docker run -d --name ras-stack-example-e2e \
            --read-only \
            --tmpfs /tmp:rw \
            --tmpfs /data:rw,uid=1000,gid=1000 \
            -p 3110:3100 \
            -e APP_URL=http://127.0.0.1:3110 \
            -e CENTRIFUGO_API_KEY=example-api-key \
            -e CENTRIFUGO_PROXY_SECRET=example-proxy-secret \
            ras-stack-example:e2e
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3110/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs ras-stack-example-e2e
          exit 1
      - name: Exercise full stack
        run: pnpm --filter @ras-stack/example-full-stack e2e
      - name: Capture container logs
        if: always()
        run: docker logs ras-stack-example-e2e > example-container.log 2>&1 || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-example-failure
          path: |
            example-container.log
            examples/full-stack/test-results
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [actions, check, example, postgres]
    permissions:
      contents: write
    uses: ./.github/workflows/release-changesets.yml
    secrets: inherit

  publish:
    needs: [release]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Publish through the OIDC-trusted workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag="$RELEASE_TAG"
          run_id=""
          for _ in $(seq 1 12); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle | jq -r --arg title "Release $RELEASE_TAG" '.[] | select(.displayTitle == $title) | .databaseId' | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
