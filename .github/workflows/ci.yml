name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-js
      - uses: ./actions/setup-just
        with:
          version: '1.58.0'
      - run: just --version
      - run: just check

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check]
    permissions:
      contents: write
    uses: ./.github/workflows/release-changesets.yml
    secrets: inherit
