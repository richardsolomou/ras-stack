name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-js
      - uses: ./actions/setup-just
        with:
          version: '1.58.0'
      - run: just --version
      - run: just check

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check]
    permissions:
      contents: write
    uses: ./.github/workflows/release-changesets.yml
    secrets: inherit

  publish:
    needs: [release]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Publish through the OIDC-trusted workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f release_tag="$RELEASE_TAG"
          run_id=""
          for attempt in $(seq 1 12); do
            run_id="$(gh run list --workflow release.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle | jq -r --arg title "Release $RELEASE_TAG" '.[] | select(.displayTitle == $title) | .databaseId' | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
