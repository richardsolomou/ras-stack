name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check-js.yml
    with:
      command: just --version && just check
      just-version: '1.58.0'

  actions:
    name: Actions and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: ./actions/setup-just
        with:
          version: '1.58.0'
      - run: just check-actions
      - run: just check-recipe-workflows

  recipes:
    name: Recipe stacks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-js
      - name: Check every stack
        env:
          # Only the postgres stack reads it, to run its integration suites against a real server.
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm recipes

  recipe-image:
    name: Full-stack recipe image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./actions/setup-js
      - name: Assemble the full-stack stack with its own install
        id: stack
        shell: bash
        run: |
          node recipes/check.mjs --install full-stack | tee "$RUNNER_TEMP/assemble.log"
          echo "directory=$(sed -n 's/^assembled full-stack in //p' "$RUNNER_TEMP/assemble.log")" >> "$GITHUB_OUTPUT"
      - name: Build the image
        env:
          STACK_DIR: ${{ steps.stack.outputs.directory }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          contexts=()
          if [[ -n "$BASE_SHA" ]]; then
            changed=$(git diff --name-only "$BASE_SHA" HEAD -- runtime/)
            if [[ -n "$changed" ]]; then
              candidate="$RUNNER_TEMP/runtime-binaries"
              docker build -f runtime/Dockerfile --output "type=local,dest=$candidate" .
              contexts+=(--build-context "runtime-binaries=$candidate")
            fi
          fi
          docker build "${contexts[@]}" -t ras-stack-recipe:full-stack "$STACK_DIR"
      - name: Scan the image
        uses: anchore/scan-action@v7
        with:
          image: ras-stack-recipe:full-stack
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Boot, sign up and in, and stop cleanly
        env:
          ORIGIN: http://127.0.0.1:3120
        run: |
          docker volume create ras-stack-recipe-data
          docker run -d --name ras-stack-recipe \
            --mount source=ras-stack-recipe-data,target=/data \
            -p 3120:3000 \
            -e APP_URL="$ORIGIN" \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
            ras-stack-recipe:full-stack
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-all-errors "$ORIGIN/api/health"
          # The built server bundles its own copy of each dependency, so sign-in can fail here while the stack's tests pass.
          account='{"name":"Recipe Check","email":"recipe-check@example.test","password":"correct horse battery staple"}'
          for path in sign-up/email sign-in/email; do
            curl --fail-with-body --silent --show-error --cookie-jar "$RUNNER_TEMP/cookies" \
              -H 'content-type: application/json' -H "origin: $ORIGIN" -d "$account" "$ORIGIN/api/auth/$path"
          done
          curl --fail-with-body --silent --show-error --cookie "$RUNNER_TEMP/cookies" "$ORIGIN/api/auth/get-session" \
            | jq -e '.user.email == "recipe-check@example.test"'
          docker stop --time 15 ras-stack-recipe
          test "$(docker inspect ras-stack-recipe --format '{{ .State.ExitCode }}')" = 0
      - name: Capture container logs
        if: failure()
        run: docker logs ras-stack-recipe || true
      - name: Remove image resources
        if: always()
        run: |
          docker rm -f ras-stack-recipe 2>/dev/null || true
          docker volume rm ras-stack-recipe-data 2>/dev/null || true

  runtime-pin:
    name: Runtime image pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-js
      - run: pnpm runtime:pin

  runtime-binaries:
    name: Runtime binaries image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime binaries
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runtime/Dockerfile
          tags: ras-stack-runtime-binaries:test
          load: true
          cache-from: type=gha,scope=runtime-binaries
          cache-to: type=gha,mode=max,scope=runtime-binaries
      - name: Inspect runtime binaries
        run: |
          labels="$(docker image inspect ras-stack-runtime-binaries:test --format '{{ json .Config.Labels }}')"
          test "$(jq -r '."org.opencontainers.image.version"' <<< "$labels")" = "$(cat runtime/VERSION)"
          test "$(docker run --rm --entrypoint /usr/local/bin/caddy ras-stack-runtime-binaries:test version)" = "v$(jq -r '."dev.ras-stack.caddy.version"' <<< "$labels")"
          docker run --rm --entrypoint /usr/local/bin/centrifugo ras-stack-runtime-binaries:test version | grep -F "Centrifugo v$(jq -r '."dev.ras-stack.centrifugo.version"' <<< "$labels") "

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [actions, check, recipe-image, recipes, runtime-binaries, runtime-pin]
    permissions:
      actions: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/release-changesets.yml
    with:
      validation-workflow: ci.yml
      tag-command: node packages/ras-stack/scripts/releaseTag.mjs
    secrets: inherit

  publish:
    needs: [release]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Publish through the OIDC-trusted workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          existing_run_ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle | jq --arg title "Release $RELEASE_TAG" '[.[] | select(.displayTitle == $title) | .databaseId]')"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"
          run_id=""
          for _ in $(seq 1 12); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle | jq -r --arg title "Release $RELEASE_TAG" --argjson existing "$existing_run_ids" '.[] | select(.displayTitle == $title and (.databaseId as $id | $existing | index($id) == null)) | .databaseId' | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}
      - name: Promote compatibility tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          compatibility_tag="v1"
          current_sha="$(git ls-remote --tags origin "refs/tags/$compatibility_tag" | awk '{print $1}')"
          if [ -n "$current_sha" ]; then
            current_release="$(git tag --points-at "$current_sha" --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)"
            if [[ ! "$current_release" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Cannot resolve the release behind $compatibility_tag" >&2
              exit 1
            fi
            if [ "$(printf '%s\n' "$current_release" "$RELEASE_TAG" | sort -V | tail -n1)" != "$RELEASE_TAG" ]; then
              echo "$compatibility_tag already points to newer release $current_release"
              exit 0
            fi
          fi
          git tag --force "$compatibility_tag" "$RELEASE_TAG"
          git push --force-with-lease="refs/tags/$compatibility_tag:$current_sha" origin "refs/tags/$compatibility_tag"
