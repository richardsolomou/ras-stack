name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check-js.yml
    with:
      command: just --version && just check
      just-version: '1.58.0'

  actions:
    name: Actions and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: ./actions/setup-just
        with:
          version: '1.58.0'
      - run: just check-actions

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ras_stack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-js
      - name: Exercise the published PostgreSQL statements
        env:
          RAS_STACK_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/ras_stack_test
        run: pnpm --filter ras-stack exec vitest run src/database/postgres-integration.test.ts --coverage.enabled=false

  peer-floor:
    name: Peer dependency floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-js
      - run: pnpm build && pnpm peer:floor

  example:
    name: Full-stack example
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/setup-js
      - uses: ./actions/setup-playwright
        with:
          install-dependencies: 'false'
          working-directory: examples/full-stack
      - uses: docker/setup-buildx-action@v4
      - name: Build package and example
        run: pnpm --filter ras-stack build && pnpm --filter @ras-stack/example-full-stack check
      - name: Build and inspect runtime binaries
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runtime/Dockerfile
          tags: ras-stack-runtime-binaries:test
          load: true
          cache-from: type=gha,scope=runtime-binaries
          cache-to: type=gha,mode=max,scope=runtime-binaries
      - name: Inspect runtime binaries
        run: |
          test "$(docker image inspect ras-stack-runtime-binaries:test --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$(cat runtime/VERSION)"
          test "$(docker run --rm --entrypoint /usr/local/bin/caddy ras-stack-runtime-binaries:test version)" = 'v2.11.4'
          docker run --rm --entrypoint /usr/local/bin/centrifugo ras-stack-runtime-binaries:test version | grep -F 'Centrifugo v6.9.1 '
      - name: Build production image
        run: docker build --build-arg RUNTIME_BINARIES_IMAGE=ras-stack-runtime-binaries:test -f examples/full-stack/Dockerfile -t ras-stack-example:e2e .
      - name: Scan production image
        uses: anchore/scan-action@v7
        with:
          image: ras-stack-example:e2e
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Start SMTP sink
        run: docker run -d --name ras-stack-example-mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:v1.27
      - name: Start production image
        run: |
          mkdir -p "$RUNNER_TEMP/ras-stack-example-backup"
          chmod 0777 "$RUNNER_TEMP/ras-stack-example-backup"
          docker volume create ras-stack-example-data
          docker run -d --name ras-stack-example-e2e \
            --read-only \
            --tmpfs /tmp:rw \
            --mount source=ras-stack-example-data,target=/data \
            --mount type=bind,source="$RUNNER_TEMP/ras-stack-example-backup",target=/backup \
            --add-host=host.docker.internal:host-gateway \
            -p 3110:3100 \
            -e APP_URL=http://127.0.0.1:3110 \
            -e CENTRIFUGO_API_KEY=example-api-key \
            -e CENTRIFUGO_PROXY_SECRET=example-proxy-secret \
            -e SMTP_HOST=host.docker.internal \
            -e SMTP_PORT=1025 \
            -e EMAIL_FROM=ras-stack@example.test \
            -e EMAIL_REQUIRE_VERIFICATION=false \
            ras-stack-example:e2e
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3110/api/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3110/api/ready >/dev/null
      - name: Exercise full stack
        run: pnpm --filter @ras-stack/example-full-stack e2e
      - name: Verify persistence and drill backup restore
        run: |
          test "$(curl --fail --silent http://127.0.0.1:8025/api/v1/messages | jq '.messages_count')" -ge 2
          upload_path="$(docker exec ras-stack-example-e2e find /data/uploads -type f -name '*.bin' -print -quit)"
          test -n "$upload_path"
          test "$(docker exec ras-stack-example-e2e cat "$upload_path")" = 'workspace proof'
          docker restart ras-stack-example-e2e
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3110/api/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3110/api/ready >/dev/null
          test "$(docker exec ras-stack-example-e2e cat "$upload_path")" = 'workspace proof'
          curl --fail --silent --cookie-jar /tmp/example-cookies \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:3110' \
            --data '{"email":"alice@example.test","password":"correct horse battery staple"}' \
            http://127.0.0.1:3110/api/auth/sign-in/email | jq -e '.user.email == "alice@example.test"'
          curl --fail --silent --cookie /tmp/example-cookies http://127.0.0.1:3110/ | grep -F 'first message'
          docker exec ras-stack-example-e2e node .output/server/database.mjs backup /backup/example.sqlite
          test -s "$RUNNER_TEMP/ras-stack-example-backup/example.sqlite"
          upload_filename="$(basename "$upload_path")"
          docker stop --time 15 ras-stack-example-e2e
          docker cp "ras-stack-example-e2e:$upload_path" "$RUNNER_TEMP/ras-stack-example-backup/$upload_filename"
          test "$(cat "$RUNNER_TEMP/ras-stack-example-backup/$upload_filename")" = 'workspace proof'
          docker volume create ras-stack-example-restored-data
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw \
            --mount source=ras-stack-example-restored-data,target=/data \
            --mount type=bind,source="$RUNNER_TEMP/ras-stack-example-backup",target=/backup,readonly \
            --entrypoint node \
            ras-stack-example:e2e \
            .output/server/database.mjs restore /backup/example.sqlite
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw \
            --mount source=ras-stack-example-restored-data,target=/data \
            --mount type=bind,source="$RUNNER_TEMP/ras-stack-example-backup",target=/backup,readonly \
            --env UPLOAD_FILENAME="$upload_filename" \
            --entrypoint /bin/sh \
            ras-stack-example:e2e \
            -c 'mkdir -p /data/uploads && cp "/backup/$UPLOAD_FILENAME" "/data/uploads/$UPLOAD_FILENAME"'
          docker run -d --name ras-stack-example-restored \
            --read-only \
            --tmpfs /tmp:rw \
            --mount source=ras-stack-example-restored-data,target=/data \
            --add-host=host.docker.internal:host-gateway \
            -p 3110:3100 \
            -e APP_URL=http://127.0.0.1:3110 \
            -e CENTRIFUGO_API_KEY=example-api-key \
            -e CENTRIFUGO_PROXY_SECRET=example-proxy-secret \
            -e SMTP_HOST=host.docker.internal \
            -e SMTP_PORT=1025 \
            -e EMAIL_FROM=ras-stack@example.test \
            -e EMAIL_REQUIRE_VERIFICATION=false \
            ras-stack-example:e2e
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3110/api/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3110/api/ready >/dev/null
          curl --fail --silent --cookie-jar /tmp/restored-example-cookies \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:3110' \
            --data '{"email":"alice@example.test","password":"correct horse battery staple"}' \
            http://127.0.0.1:3110/api/auth/sign-in/email | jq -e '.user.email == "alice@example.test"'
          curl --fail --silent --cookie /tmp/restored-example-cookies http://127.0.0.1:3110/ | grep -F 'first message'
          test "$(docker exec ras-stack-example-restored cat "/data/uploads/$upload_filename")" = 'workspace proof'
      - name: Capture container logs
        if: always()
        run: |
          docker logs ras-stack-example-e2e > example-container.log 2>&1 || true
          docker logs ras-stack-example-restored > example-restored-container.log 2>&1 || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-example-failure
          path: |
            example-container.log
            example-restored-container.log
            examples/full-stack/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove example resources
        if: always()
        run: |
          docker rm -f ras-stack-example-e2e ras-stack-example-restored ras-stack-example-mailpit 2>/dev/null || true
          docker volume rm ras-stack-example-data ras-stack-example-restored-data 2>/dev/null || true
          rm -rf "${RUNNER_TEMP:?}/ras-stack-example-backup"

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [actions, check, example, peer-floor, postgres]
    permissions:
      contents: write
    uses: ./.github/workflows/release-changesets.yml
    secrets: inherit

  publish:
    needs: [release]
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Publish through the OIDC-trusted workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          existing_run_ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle | jq --arg title "Release $RELEASE_TAG" '[.[] | select(.displayTitle == $title) | .databaseId]')"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG"
          run_id=""
          for _ in $(seq 1 12); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle | jq -r --arg title "Release $RELEASE_TAG" --argjson existing "$existing_run_ids" '.[] | select(.displayTitle == $title and (.databaseId as $id | $existing | index($id) == null)) | .databaseId' | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
