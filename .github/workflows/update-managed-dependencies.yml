name: Update managed RAS dependencies

on:
  workflow_call:
    secrets:
      update-token:
        description: Optional bot token to trigger CI without GitHub token approval.
        required: false

jobs:
  regenerate:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Detect RAS version change
        id: version
        uses: actions/github-script@v9
        with:
          script: |
            const versions = await Promise.all([
              context.payload.pull_request.base.sha,
              context.payload.pull_request.head.sha,
            ].map(async ref => {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path: 'package.json', ref });
              const manifest = JSON.parse(Buffer.from(data.content, 'base64').toString());
              return manifest.dependencies?.['ras-stack'] ?? manifest.devDependencies?.['ras-stack'];
            }));
            core.setOutput('changed', Boolean(versions[1] && versions[0] !== versions[1]));
      - uses: actions/checkout@v7
        if: steps.version.outputs.changed == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: richardsolomou/ras-stack/actions/setup-js@v1
        if: steps.version.outputs.changed == 'true'
        with:
          install: 'false'
      - name: Regenerate managed installation
        if: steps.version.outputs.changed == 'true'
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec ras install
      - name: Check for generated changes
        if: steps.version.outputs.changed == 'true'
        id: changes
        shell: bash
        run: |
          if ! git diff --quiet -- .pnpmfile.cjs pnpm-lock.yaml; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.changes.outputs.changed == 'true'
        with:
          name: ras-managed-dependencies
          path: |
            .pnpmfile.cjs
            pnpm-lock.yaml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: regenerate
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ras-managed-dependencies
          path: ${{ runner.temp }}/ras-managed-dependencies
      - uses: richardsolomou/ras-stack/actions/commit-managed-dependencies@v1
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}
          directory: ${{ runner.temp }}/ras-managed-dependencies
          token: ${{ secrets.update-token || github.token }}
