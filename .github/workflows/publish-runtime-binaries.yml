name: Publish runtime binaries

on:
  push:
    tags: [runtime-v*]

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "runtime-v$(cat runtime/VERSION)"
          git fetch origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          run_id="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run watch "$run_id" --exit-status
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish binaries
        uses: docker/build-push-action@v7
        with:
          context: .
          file: runtime/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/ras-stack-runtime-binaries:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/ras-stack-runtime-binaries:sha-${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
