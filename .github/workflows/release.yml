name: Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag to verify and publish.
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - uses: ./actions/setup-js
      - uses: ./actions/setup-just
        with:
          version: '1.58.0'
      - run: just check
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
      - name: Check registry
        id: registry
        run: |
          if npm view "$(node -p "require('./package.json').name + '@' + require('./package.json').version")" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.publish == 'true'
        run: npm publish --access public --provenance
