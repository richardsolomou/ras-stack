name: Release
run-name: Release ${{ inputs.release_tag || github.event.release.tag_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to verify and publish.
        required: true
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
      - uses: ./actions/setup-js
      - uses: ./actions/setup-just
        with:
          version: '1.58.0'
      - run: just check
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "v$(node -p "require('./packages/ras-stack/package.json').version")" = "$RELEASE_TAG"
          test "$(node -p "require('./packages/ras-stack/package.json').version")" = "$(node -p "require('./packages/create-ras-app/package.json').version")"
      - name: Publish packages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-packages"
          for directory in packages/ras-stack packages/create-ras-app; do
            package_name="$(node -p "require('./$directory/package.json').name")"
            package_version="$(node -p "require('./$directory/package.json').version")"
            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "$package_name@$package_version is already published"
              continue
            fi
            archive="$RUNNER_TEMP/npm-packages/$package_name-$package_version.tgz"
            (cd "$directory" && pnpm pack --out "$archive")
            npm publish "$archive" --access public --provenance
          done
