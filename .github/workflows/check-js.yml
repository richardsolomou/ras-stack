name: Check JavaScript project

on:
  workflow_call:
    inputs:
      command:
        description: Repository-owned check command.
        type: string
        default: pnpm check
      audit-level:
        description: Run pnpm audit at this level, or leave empty to skip it.
        type: string
        default: ''
      just-version:
        description: Install this Just version, or leave empty when the command does not use Just.
        type: string
        default: ''
      runner:
        description: GitHub-hosted or self-hosted runner label.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Maximum job runtime.
        type: number
        default: 30

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Require current dependency base
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'dependabot/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            [[ $sha =~ ^[0-9a-fA-F]{40}$ ]]
            git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha"
          done
          if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
            echo "dependency branch does not contain the current base; refresh the dependency branch before merging" >&2
            exit 1
          fi
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.38.2
      - if: inputs.just-version != ''
        uses: richardsolomou/ras-stack/actions/setup-just@v0.38.2
        with:
          version: ${{ inputs.just-version }}
      - name: Audit dependencies
        if: inputs.audit-level != ''
        env:
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: pnpm audit --audit-level "$AUDIT_LEVEL"
      - name: Run checks
        env:
          CHECK_COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$CHECK_COMMAND"
