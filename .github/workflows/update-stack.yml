name: Update RAS stack

# Kept so v5 applications that schedule this workflow through the moving `v1` tag keep passing until they adopt recipes and delete their caller.
on:
  workflow_call:
    inputs:
      target:
        description: Unused since v6.
        type: string
        default: latest
    secrets:
      UPGRADE_TOKEN:
        description: Unused since v6.
        required: false

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "::notice title=RAS update retired::ras-stack v6 replaced managed installs with recipes. Delete the workflow that calls update-stack.yml and follow https://github.com/richardsolomou/ras-stack/blob/main/docs/upgrades.md"
