name: PR preview deploy

on:
  workflow_run:
    workflows: [PR preview build]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [closed]

concurrency:
  group: preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
  # Cancelling mid-deploy can leave Dokploy half-updated and the pull request's preview status stuck on building.
  cancel-in-progress: false

jobs:
  preview:
    permissions:
      actions: read
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: write
    uses: richardsolomou/ras-stack/.github/workflows/deploy-dokploy-preview.yml@v1
    with:
      package: app
      local-image: app
      application-prefix: app
      port: 3000
      domain: ras.sh
      subdomain-prefix: app-pr
      cloudflare-zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      environment: |
        APP_URL={{PREVIEW_URL}}
      marker: <!-- app-preview -->
      note: Preview data is disposable and resets on every deployment. Never enter real data or credentials.
    secrets: inherit
