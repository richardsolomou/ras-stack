name: Set up SpacetimeDB
description: Install the SpacetimeDB CLI release that matches the pinned spacetimedb package.

outputs:
  cli-path:
    description: Absolute path to the installed CLI.
    value: ${{ steps.spacetime.outputs.cli-path }}

runs:
  using: composite
  steps:
    # Keep the version equal to the spacetimedb package, so generated bindings and published modules match the SDK.
    # The checksum is for the Linux X64 archive; an ARM64 runner needs that archive's checksum instead.
    - uses: richardsolomou/ras-stack/actions/setup-spacetime@v1
      id: spacetime
      with:
        version: '2.14.1'
        sha256: 67a3c99c19abc4ba58b4ab999b309b3c5899602b3f0f7ae75e296335c174c82b
